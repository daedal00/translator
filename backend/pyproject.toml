[project]
name = "translator-backend"
version = "0.1.0"
description = "Real-time sermon translation backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.8",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# Install with: uv sync --extra ml
ml = [
    "faster-whisper>=1.1",
    "ctranslate2>=4.4",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "aiortc>=1.9",
    "torch>=2.3",
    "torchaudio>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
